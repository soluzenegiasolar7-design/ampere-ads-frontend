<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ads Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>📊 Ads Dashboard</h1>
    <div class="period-selector">
      <label>Período:</label>
      <select id="days">
        <option value="7">7 dias</option>
        <option value="30" selected>30 dias</option>
        <option value="90">90 dias</option>
      </select>
      <button id="btn-collect">▶ Coletar agora</button>
    </div>
  </header>

  <section class="cards" id="summary-cards">
    <div class="card"><span class="label">Investimento</span><span class="value" id="total-spend">—</span></div>
    <div class="card"><span class="label">Leads</span><span class="value" id="total-leads">—</span></div>
    <div class="card"><span class="label">Conversões</span><span class="value" id="total-conv">—</span></div>
    <div class="card highlight"><span class="label">ROAS</span><span class="value" id="roas">—</span></div>
    <div class="card"><span class="label">CPL</span><span class="value" id="cpl">—</span></div>
    <div class="card"><span class="label">CPA</span><span class="value" id="cpa">—</span></div>
  </section>

  <section class="charts">
    <div class="chart-box">
      <h2>Investimento × Leads por dia</h2>
      <canvas id="chart-daily"></canvas>
    </div>
    <div class="chart-box">
      <h2>ROAS por campanha</h2>
      <canvas id="chart-roas"></canvas>
    </div>
  </section>

  <section class="alerts-section">
    <h2>⚠️ Alertas recentes</h2>
    <ul id="alerts-list"><li>Carregando...</li></ul>
  </section>

  <section class="table-section">
    <h2>Métricas por campanha</h2>
    <div id="table-container"></div>
  </section>

  <section class="ai-section">
    <div class="ai-header">
      <h2>🤖 Análise com IA</h2>
      <button id="btn-analyze">✨ Analisar campanhas</button>
    </div>
    <div id="ai-result" class="ai-result hidden"></div>
  </section>

  <script src="dashboard.js"></script>
</body>
</html>
